name: Dependency Graph

# Submits this project's own sbt dependency tree to GitHub's Dependency Graph on every push to
# main, which enables Dependabot vulnerability alerts on the plugin's own (direct and transitive)
# dependencies. This is how an sbt project "dogfoods" dependency scanning: the plugin cannot be
# applied to its own build, so GitHub's Dependency Graph plus Dependabot alerts provide the
# equivalent assurance about dependency-check-core's tree and the other build dependencies.

on:
  push:
    branches: [ "main" ]

# Submitting a dependency snapshot requires write access to the repository's dependency graph.
permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'sbt'

      - uses: sbt/setup-sbt@b113b960ba361e87e08ce02a390d51871b7ee459 # v1.5.13

      - name: Submit sbt dependency graph
        uses: scalacenter/sbt-dependency-submission@d84eef4c09e633bcf5f113bcad7fd5e9af1baee9 # v3.2.3
