name: Pull Request

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# Cancel superseded runs when a PR branch is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LOG_LEVEL: INFO
  DATA_DIRECTORY: /tmp/cve-data
  CI: true
  # NVD_API_KEY is intentionally NOT exposed to pull_request builds: fork PRs never receive secrets
  # (the key would be empty), and same-repo PRs run the PR's own code, so injecting it here is an
  # unnecessary exposure. PR runs rely on the restored CVE cache; the key lives on the trusted
  # push (main.yaml) and workflow_dispatch (generate-cache.yaml) runs that populate that cache.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'sbt'

      - uses: sbt/setup-sbt@82da71df4e122282484a99a8d70096bc2369dbd8 # v1.5.9

      - name: Check formatting, scalafix, and headers
        run: sbt styleCheck

      - name: Restore CVE Database
        id: restore-cve-db
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/cve-data
          key: ${{ runner.os }}-cve-cache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cve-cache-

      - name: Test Coverage
        run: sbt testCoverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scoverage-report
          path: |
            **/scoverage-report/**
            **/coverage-report/**
          if-no-files-found: warn
