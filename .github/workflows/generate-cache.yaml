name: Generate CVE Cache

on: workflow_dispatch

permissions:
  contents: read

env:
  LOG_LEVEL: INFO
  DATA_DIRECTORY: /tmp/cve-data/
  CI: true
  FORCE_REFRESH: true
  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'sbt'

      - uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14

      - name: Create CVE Database folder (optional, but robust)
        run: mkdir -p /tmp/cve-data

      - name: Generate CVE db
        run: sbt 'testOnly *DbSuite'

      - name: Save generated CVE Database
        id: save-cve-db
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/cve-data
          key: ${{ runner.os }}-cve-cache-${{ github.run_id }}
